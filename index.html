<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feldnotizen — Die Maxwellschen Gleichungen</title>
<meta name="description" content="Die vier Maxwellschen Gleichungen mit Vektoranalysis, physikalischer Bedeutung und der Ableitung von Licht als elektromagnetischer Welle.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap" id="wrap"></div>

<script>
Promise.all(
  ['part1.html','part2.html','part3.html','part4.html','part5.html'].map(function(u){
    return fetch(u).then(function(r){
      if (!r.ok) throw new Error('Konnte ' + u + ' nicht laden (' + r.status + ')');
      return r.text();
    });
  })
).then(function(parts){
  document.getElementById('wrap').innerHTML = parts.join('');
  var s = document.createElement('script');
  s.src = 'app.js';
  document.body.appendChild(s);

  // Inhalt wird erst nachgeladen — ein #anker in der URL muss danach neu angesprungen werden.
  if (location.hash){
    var target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView();
  }
}).catch(function(err){
  document.getElementById('wrap').innerHTML =
    '<p style="padding:60px 0">Fehler beim Laden der Seite: ' + err.message + '</p>';
});
</script>
</body>
</html>
